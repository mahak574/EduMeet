services:
  mongo:
    image: mongo:7.0
    container_name: edumeet-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-edumeet}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-devpassword123}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - edumeet-network

  redis:
    image: redis:7.2-alpine
    container_name: edumeet-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-devredispass123} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edumeet-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: edumeet-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://${MONGO_INITDB_ROOT_USERNAME:-edumeet}:${MONGO_INITDB_ROOT_PASSWORD:-devpassword123}@mongo:27017/edumeet?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-devredispass123}@redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mongo
      - redis
    networks:
      - edumeet-network

  y-websocket:
    build:
      context: ./sidecars/y-websocket
      dockerfile: ../../docker/y-websocket.Dockerfile
    container_name: edumeet-y-websocket
    restart: unless-stopped
    environment:
      - PORT=1234
      - REDIS_URL=redis://:${REDIS_PASSWORD:-devredispass123}@redis:6379/0
    ports:
      - "127.0.0.1:1234:1234"
    depends_on:
      - redis
    networks:
      - edumeet-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: edumeet-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - edumeet-network

networks:
  edumeet-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
